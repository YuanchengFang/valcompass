name: ValCompass
options:
  bundleIdPrefix: app.valcompass
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
targets:
  ValCompass:
    type: application
    platform: iOS
    sources:
      - ValCompass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.valcompass.ios
        INFOPLIST_FILE: ValCompass/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: "NO"
  ValCompassTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ValCompassTests
        excludes:
          - "Fixtures/**"
      - path: ValCompassTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: ValCompass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.valcompass.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  ValCompass:
    build:
      targets:
        ValCompass: all
        ValCompassTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ValCompassTests
